# Example only; configure paths, domain and certificates before use. Not deployed.
# Keep query strings, cookies and account link fragments out of access logs.
log_format examledger '$remote_addr $request_method $uri $status';
server {
    listen 443 ssl;
    server_name examledger.example.edu;
    ssl_certificate /etc/ssl/examledger/fullchain.pem;
    ssl_certificate_key /etc/ssl/examledger/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /var/www/examledger;
    access_log /var/log/nginx/examledger-access.log examledger;
    client_max_body_size 768k;
    add_header Referrer-Policy no-referrer always;
    add_header X-Content-Type-Options nosniff always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'" always;
    location /api/v1/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
        # App intentionally does not trust forwarded client IPs. For a real
        # gateway, implement/test gateway rate limiting and exact proxy trust.
    }
    location /assets/ { try_files $uri =404; expires 1y; }
    location / { try_files $uri $uri/ /index.html; expires -1; }
}
server {
    listen 80;
    server_name examledger.example.edu;
    return 301 https://examledger.example.edu$request_uri;
}
